version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: motorhome
      POSTGRES_USER: motorhome
      POSTGRES_PASSWORD: motorhome
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/motorhome
      SPRING_DATASOURCE_USERNAME: motorhome
      SPRING_DATASOURCE_PASSWORD: motorhome
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - db
      - redis

volumes:
  db-data:
